<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK</title>
  <link rel="stylesheet" href="stylesheet.css">

  <style>
    /* Desktop navigation layout */
    #navigation > div {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 10px;
    }

    #li {
      margin-right: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    #lg {
      margin-left: auto;
    }

    #hamburger {
      display: none;
    }

    #mobile-menu {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }

    /* Desktop image layout */
    #image-container img {
      height: 400px;
      width: 400px;
      margin: 10px;
    }

    /* === Mobile Layout === */
    @media (max-width: 768px) {
      #navigation > div {
        display: none;
      }

      #hamburger {
        display: block;
        text-align: center;
        font-size: 30px;
        cursor: pointer;
        width: 100%;
        padding: 10px 0;
      }

      #mobile-menu.show {
        display: flex;
      }

      #mobile-menu a {
        text-decoration: none;
        color: black;
        padding: 10px 0;
        display: block;
        width: 100%;
        text-align: center;
      }

      #mobile-menu a.active {
        color: red;
      }

      #image-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #image-container img {
        width: 90%;
        height: auto;
        margin: 10px 0;
      }
    }
  </style>

  <script>
    function toggleMenu() {
      var menu = document.getElementById("mobile-menu");
      menu.classList.toggle("show");
    }
  </script>
</head>

<body class="show">

  <!-- Desktop Navigation -->
  <section id="navigation">
    <div>
      <a href="homepage.html"><div id="li">NAVILAN</div></a>
      <a href="Work.html"><div id="li" style="color: red;">WORK</div></a>
      <a href="STUDIO.html"><div id="li">STUDIO</div></a>
      <a href="Get in touch.html"><div id="li">GET IN TOUCH</div></a>
      <div id="lg"><img loading="lazy" decoding="async" src="logoblack.webp" height="39px" width="50px"></div>
    </div>
  </section>

  <!-- Mobile Hamburger Icon -->
  <div id="hamburger" onclick="toggleMenu()">☰</div>

  <!-- Mobile Navigation -->
  <div id="mobile-menu">
    <a href="homepage.html">NAVILAN</a>
    <a href="Work.html" class="active">WORK</a>
    <a href="STUDIO.html">STUDIO</a>
    <a href="Get in touch.html">GET IN TOUCH</a>
  </div>

  <!-- Images Section -->
  <div id="image-container">
    <img loading="lazy" decoding="async" id="show" src="07-Mr.Pragadeesh Residence/01.webp">
    <img loading="lazy" decoding="async" id="show" src="07-Mr.Pragadeesh Residence/2.webp">
    <img loading="lazy" decoding="async" id="show" src="07-Mr.Pragadeesh Residence/3.webp">
  </div>


  <footer class="site-footer">
    <div class="site-footer__inner">
      <img loading="lazy" decoding="async" class="site-footer__logo" src="logoblack.webp" alt="Navilan logo" />
      <p class="site-footer__copyright">Ⓒ Copyright 2025 Navilan. All rights reserved.</p>
      <div class="site-footer__social">
        <a href="mailto:info@navilanarchitects.com" aria-label="Email Navilan">
          <img loading="lazy" decoding="async" src="email.webp" width="30" height="30" alt="Email" />
        </a>
        <a href="https://www.facebook.com/" aria-label="Navilan on Facebook">
          <img loading="lazy" decoding="async" src="facebook.webp" width="30" height="30" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/" aria-label="Navilan on Instagram">
          <img loading="lazy" decoding="async" src="instagram.webp" width="30" height="30" alt="Instagram" />
        </a>
        <a href="https://www.linkedin.com/" aria-label="Navilan on LinkedIn">
          <img loading="lazy" decoding="async" src="linkedin.webp" width="35" height="35" alt="LinkedIn" />
        </a>
      </div>
      <p class="site-footer__credit">Developed by <a href="https://www.cubecorpsol.com/">Cube Corpsol</a></p>
    </div>
  </footer>
</body>
</html>
