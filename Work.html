  <style>
    /* DESKTOP NAVIGATION */
    #navigation > div {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 16px;
      box-sizing: border-box;
    }

    #li {
      margin: 10px;
      font-size: 18px;
    }

    #lg {
      margin-left: auto;
    }

    #row1 {
      margin-bottom: 11px;
    }
    .col1{
    height: 100%;
  }


    /* DARK HOVER EFFECT + CENTERED TITLE */
    .img-hover {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    .img-hover img {
      display: block;
      width: 100%;
      height: auto;
      transition: 0.3s ease;
    }

    .img-hover::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .img-hover::before {
      content: attr(title);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
      pointer-events: none;
    }

    .img-hover:hover::before,
    .img-hover:hover::after {
      opacity: 1;
    }

    @keyframes mobileTitleReveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #fff;
    }

    .logo-panel img {
      width: auto;
      max-width: 220px;
      height: auto;
      object-fit: contain;
      margin: 0;
    }

    .site-footer-wrap {
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 0 16px;
      box-sizing: border-box;
    }

    .site-footer-wrap footer {
      margin: 0 !important;
      text-align: left;
    }

    .site-footer-wrap #icon {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .site-footer-wrap #icon img {
      margin-right: 0 !important;
    }

    .site-footer-wrap .cube {
      margin: 12px 0 0 !important;
      text-align: left;
    }
    

    /* DESKTOP IMAGE STYLES */
    @media screen and (min-width: 769px) {
      #Images {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
      }

      #row1 {
        display: flex;
        justify-content: flex-start;
        gap: 11px;
        margin-bottom: 11px;
      }

      #side {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      #Images img {
        width: 100%;
        max-width: 680px;
        min-width: 0;
        height: auto;
        object-fit: cover;
        display: block;
      }

      #Images > a,
      #row1 > a,
      #row1 > div {
        display: flex;
        justify-content: center;
      }

      .col1 > #side img {
        height: calc(100%);
        object-fit: cover;
      }

      .col1 {
        width: 100%;
        max-width: 1360px;
        min-width: 0;
      }

      .col1 > .col2 {
        height: calc(100%);
      }

      .col1 > div:first-child {
        flex: 1;
        max-width: 50%;
        height: auto;
      }

      .col1 > #side {
        flex: 1;
        max-width: 50%;
      }

      .col1 img {
        height: 100%;
        object-fit: cover;
      }
      .col3{
        height: calc(350%);
      }
      .col2{
        height:80%;
      }

      .logo-panel {
        min-height: 300px;
      }
    }

    /* HAMBURGER ICON (Mobile only) */
    #hamburger {
      display: none;
      font-size: 30px;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
    }

    /* MOBILE MENU */
    #mobile-menu {
      display: none;
      flex-direction: column;
      align-items: center;
      background-color: white;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    #mobile-menu a,
    #mobile-menu div {
      width: 100%;
      padding: 12px 16px;
      box-sizing: border-box;
      text-align: center;
      color: black;
      text-decoration: none;
      font-size: 18px;
    }

    #mobile-menu .active {
      color: red;
      font-weight: 700;
    }

    /* MOBILE IMAGE STYLES */
    @media (max-width: 768px) {
      #navigation > div {
        display: none;
      }

      /* On touch devices, keep project labels visible instead of hover-only */
      .img-hover {
        width: 100%;
      }

      .img-hover::after {
        opacity: 1;
        inset: auto 0 0 0;
        height: 34%;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0));
      }

      .img-hover::before {
        opacity: 1;
        top: auto;
        bottom: 10px;
        left: 12px;
        right: auto;
        transform: none;
        width: max-content;
        max-width: calc(100% - 24px);
        white-space: normal;
        font-size: clamp(14px, 3.8vw, 18px);
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.25;
        text-align: left;
        padding: 8px 12px;
        border-left: 3px solid #f2b84b;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        animation: mobileTitleReveal 0.55s ease-out both;
      }

      #hamburger {
        display: block;
        width: 100%;
      }

      #mobile-menu.show {
        display: flex;
      }

      #Images {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin: 0 auto;
      }

      #row1,
      #side {
        flex-direction: column;
        align-items: center;
        width: 100% !important;
      }

      #Images img {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        margin-bottom: 11px;
      }

      #Images > a,
      #side > a,
      #row1 > div,
      #row1 > a {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      #Copyright {
        margin-left: 20%;
      }
      .col2{
        display: block;
      }

      .logo-panel {
        padding: 20px 0;
      }

      .logo-panel img {
        width: auto !important;
        max-width: 150px;
      }

      .logo-row-mobile-hide {
        display: none !important;
      }

      .site-footer-wrap footer,
      .site-footer-wrap .cube {
        text-align: center;
      }

      .site-footer-wrap #icon {
        justify-content: center;
      }

    }
    @media (min-width: 768px) and (max-width: 1025px) {
      .col2 {
        height: auto;
      }
    }


  </style>
