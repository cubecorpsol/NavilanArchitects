<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Rajesh Residence</title>
  <link rel="stylesheet" href="stylesheet.css">

  <style>
    @media (max-width: 768px) {
      #navigation > div {
        display: none;
      }

      #hamburger {
        display: block;
        font-size: 30px;
        text-align: center;
        cursor: pointer;
        padding: 10px 0;
      }

      #mobile-menu {
        display: none;
        flex-direction: column;
        align-items: center;
        background-color: white;
        width: 100%;
      }

      #mobile-menu.show {
        display: flex;
      }

      #mobile-menu a {
        text-decoration: none;
        color: black;
        padding: 10px 0;
        font-weight: bold;
      }

      #mobile-menu a.active {
        color: red;
      }

      .project-images {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .project-images img {
        width: 90%;
        height: auto;
        margin: 10px 0;
      }
    }

    @media (min-width: 769px) {
      #hamburger,
      #mobile-menu {
        display: none;
      }

      #navigation > div {
        display: flex;
        align-items: center;
        margin-left: 35px;
        margin-top: 20px;
      }

      #li {
        margin-right: 30px;
        font-weight: bold;
      }

      #lg {
        margin-left: auto;
        margin-right: 40px;
      }

      .project-images {
        margin-left: 35px;
        margin-top: 50px;
      }

      .project-images img {
        margin-right: 15px;
      }
    }
  </style>

  <script>
    function toggleMenu() {
      var menu = document.getElementById("mobile-menu");
      menu.classList.toggle("show");
    }
  </script>
</head>

<body class="show">

  <section id="navigation">
    <div>
      <a href="homepage.html"><div id="li">NAVILAN</div></a>
      <a href="Work.html"><div id="li" style="color: red;">WORK</div></a>
      <a href="STUDIO.html"><div id="li">STUDIO</div></a>
      <a href="Get in touch.html"><div id="li">GET IN TOUCH</div></a>
      <div id="lg"><img loading="lazy" decoding="async" src="logoblack.webp" height="39" width="50" alt="Logo"></div>
    </div>
  </section>

  <div id="hamburger" onclick="toggleMenu()">☰</div>

  <div id="mobile-menu">
    <a href="homepage.html">NAVILAN</a>
    <a href="Work.html" class="active">WORK</a>
    <a href="STUDIO.html">STUDIO</a>
    <a href="Get in touch.html">GET IN TOUCH</a>
  </div>

  <div class="project-images">
    <img loading="lazy" decoding="async" src="12-Mr.Rajesh Residence/01.webp" height="400" width="400" alt="Mr Rajesh Residence 1">
    <img loading="lazy" decoding="async" src="12-Mr.Rajesh Residence/2.webp" height="400" width="400" alt="Mr Rajesh Residence 2">
    <img loading="lazy" decoding="async" src="12-Mr.Rajesh Residence/3.webp" height="400" width="400" alt="Mr Rajesh Residence 3">
  </div>


  <footer class="site-footer">

      <p class="site-footer__copyright">Ⓒ Copyright 2025 Navilan. All rights reserved.</p>
      <div class="site-footer__social">
        <a href="mailto:info@navilanarchitects.com" aria-label="Email Navilan">
          <img loading="lazy" decoding="async" src="email.webp" width="30" height="30" alt="Email" />
        </a>
        <a href="https://www.facebook.com/" aria-label="Navilan on Facebook">

        <a href="https://www.linkedin.com/" aria-label="Navilan on LinkedIn">
          <img loading="lazy" decoding="async" src="linkedin.webp" width="35" height="35" alt="LinkedIn" />
        </a>
      </div>
      <p class="site-footer__credit">Developed by <a href="https://www.cubecorpsol.com/">Cube Corpsol</a></p>
    </div>
  </footer>
</body>
</html>
